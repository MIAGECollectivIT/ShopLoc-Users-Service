server:
  port: ${PORT:8080}

spring:
  application:
    name: users-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:devuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:devpassword}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration${FLYWAY_ADDITIONAL_LOCATIONS:}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    persistAuthorization: true

# Application configuration including OpenAPI extensions and Authentication
application:
  openapi:
    title: "ShopLoc - Users Service API"
    description: "User management REST API for the ShopLoc platform"
    version: "1.0.0"
    contact:
      name: "MIAGE Collectiv'IT Team"
      email: "contact@collectivit.miage.fr"
      url: "https://github.com/MIAGECollectivIT"
    license:
      name: "MIT"
      url: "https://opensource.org/licenses/MIT"
    extensions:
      x-api-audience: "ShopLoc Internal Microservices"
      x-service-environment: "${ENVIRONMENT:development}"
      x-service-name: "users-service"
  security:
    auth-type: "Bearer JWT"
    jwt:
      header-name: "Authorization"
      token-prefix: "Bearer "
      secret-key: "${JWT_SECRET:dGhpc2lzYXZlcnlzZWNyZXRqd3R1c2Vyc3NlcnZpY2VrZXkxMjM0NTY=}"
      issuer: "shoploc-auth-service"
      expiration-ms: 86400000
    description: "Authenticate using a JWT Bearer token. Enter your token prefixed with 'Bearer ' or simply the token value."
