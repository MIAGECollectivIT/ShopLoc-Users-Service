server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: users-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:devuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: UsersServiceHikariCP
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
        format_sql: false
        temp:
          use_jdbc_metadata_defaults: false
        boot:
          allow_jdbc_metadata_access: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration${FLYWAY_ADDITIONAL_LOCATIONS:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
    from: ${MAIL_FROM:contact@shop-loc.fr}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    persistAuthorization: true
    default-model-rendering: example
  paths-to-match:
    - /v1/**
    - /.well-known/**

# Application configuration including OpenAPI extensions and Authentication
application:
  openapi:
    title: "ShopLoc - Users Service API"
    description: "User management REST API for the ShopLoc platform"
    version: "1.0.0"
    contact:
      name: "MIAGE Collectiv'IT Team"
      email: "contact@collectivit.miage.fr"
      url: "https://github.com/MIAGECollectivIT"
    license:
      name: "MIT"
      url: "https://opensource.org/licenses/MIT"
    extensions:
      x-api-audience: "ShopLoc Internal Microservices"
      x-service-environment: "${ENVIRONMENT:development}"
      x-service-name: "users-service"
  mail:
    citizen-card-service-email: ${CITIZEN_CARD_SERVICE_EMAIL:citoyen-numerique@shop-loc.fr}
  security:
    # ==============================================================================
    # SECURITY / WARNING: DO NOT MODIFY THIS VALUE!
    # Public user registration is intentionally disabled to protect the platform
    # against brute-force attacks and bots.
    # All authorized users must be provisioned via SQL migrations.
    # ==============================================================================
    registration-enabled: ${REGISTRATION_ENABLED:false}
    auth-type: "Bearer JWT"
    jwt:
      header-name: "Authorization"
      token-prefix: "Bearer "
      private-key: "${JWT_PRIVATE_KEY:}"
      public-key: "${JWT_PUBLIC_KEY:}"
      key-id: "${JWT_KEY_ID:shoploc-key-1}"
      issuer: "shoploc-auth-service"
      expiration-ms: 7200000
    lockout:
      max-attempts: ${SECURITY_MAX_LOGIN_ATTEMPTS:5}
      lockout-minutes: ${SECURITY_LOCKOUT_MINUTES:15}
    description: "Authenticate using a JWT Bearer token. Enter your token prefixed with 'Bearer ' or simply the token value."

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
