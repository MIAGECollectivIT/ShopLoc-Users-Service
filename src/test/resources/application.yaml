spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    persistAuthorization: true
    default-model-rendering: example
  paths-to-match:
    - /v1/**
    - /.well-known/**

application:
  security:
    jwt:
      header-name: "Authorization"
      token-prefix: "Bearer "
      private-key: ""
      public-key: ""
      issuer: "shoploc-auth-service"
      expiration-ms: 7200000
