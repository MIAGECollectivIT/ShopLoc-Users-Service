name: CD Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prod-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: TESTS & MAVEN COMPILATION
  # ==========================================
  test:
    name: Maven Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ vars.JAVA_VERSION }}
          cache: 'maven'

      - name: Run Maven Tests and Verification
        run: mvn clean verify

  # ==========================================
  # JOB 2: VERSIONING (Semantic Release)
  # ==========================================
  release:
    name: Semantic Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # JOB 3: BUILD & PUSH DOCKER IMAGE (ARM64)
  # ==========================================
  build-and-push:
    name: Build & Push Docker (Prod)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tags.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Tags
        id: tags
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          if [ "${{ needs.release.outputs.new_release_published }}" == "true" ]; then
            echo "IMAGE_TAG=v${{ needs.release.outputs.new_release_version }}" >> $GITHUB_OUTPUT
            echo "TAG_LIST=ghcr.io/$REPO:v${{ needs.release.outputs.new_release_version }},ghcr.io/$REPO:latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "TAG_LIST=ghcr.io/$REPO:${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.TAG_LIST }}

  # ==========================================
  # JOB 4: DEPLOY TO K3S (PROD)
  # ==========================================
  deploy:
    name: Deploy to K3s Prod
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to K3s Prod
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          DEPLOYMENT_NAME: ${{ vars.K8S_DEPLOYMENT_NAME }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE_PROD }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          REPO="${GITHUB_REPOSITORY,,}"
          echo "Deploying to PRODUCTION ($NAMESPACE) for $DEPLOYMENT_NAME with image tag: $IMAGE_TAG"
          kubectl set image deployment/$DEPLOYMENT_NAME $DEPLOYMENT_NAME=ghcr.io/$REPO:$IMAGE_TAG -n $NAMESPACE
