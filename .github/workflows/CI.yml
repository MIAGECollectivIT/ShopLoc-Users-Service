name: CI

on:
  pull_request:
    branches: [ "main", "dev" ]
    # Globally ignore files that have no impact on the build execution
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Cancel previous in-flight runs on the same branch/PR when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Build, Tests & Quality Checks (Spotless, PMD, Enforcer, JaCoCo)
        run: ./mvnw -B -ntp -T 1C verify

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7
