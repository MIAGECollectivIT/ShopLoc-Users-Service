name: CD Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: TESTS & MAVEN COMPILATION
  # ==========================================
  test:
    name: Maven Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ vars.JAVA_VERSION }}
          cache: 'maven'

      - name: Run Maven Tests and Verification
        run: mvn clean verify

  # ==========================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE (ARM64)
  # ==========================================
  build-and-push:
    name: Build & Push Docker (Dev)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:dev

  # ==========================================
  # JOB 3: DEPLOY TO K3S (DEV)
  # ==========================================
  deploy:
    name: Deploy to K3s Dev
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to K3s Dev
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
          DEPLOYMENT_NAME: ${{ vars.K8S_DEPLOYMENT_NAME }}
          NAMESPACE: ${{ vars.K8S_NAMESPACE_DEV }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          REPO="${GITHUB_REPOSITORY,,}"
          echo "Deploying to DEV ($NAMESPACE) for $DEPLOYMENT_NAME with image tag: dev"
          kubectl set image deployment/$DEPLOYMENT_NAME $DEPLOYMENT_NAME=ghcr.io/$REPO:dev -n $NAMESPACE
          
          # Force restart to ensure Kubernetes pulls the updated image tag
          kubectl rollout restart deployment/$DEPLOYMENT_NAME -n $NAMESPACE
